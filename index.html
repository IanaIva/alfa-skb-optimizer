  /* Layout: профиль клиента слева · телефон по центру · разбор решения оптимизатора справа.
     Единый светлый мир кейса «Альфа-Будущее»: серый лист, белые карточки, фирменные красный / лайм / фиолетовый / синий. */
  :root {
    color-scheme: dark;
    --page: #050506;
    --paper: #26262C;
    --surface: #18181C;
    --surface2: #202025;
    --chip: #3C3C44;
    --ink: #F5F5F6;
    --muted: #B4B4BC;

    --fg: 255 255 255;

    --t-pos: #B6E33C; --t-warn: #F5B342; --t-stop: #FF4A3D; --t-neutral: #D4D4D8; --t-off: #7C7C84; --t-red-soft: #FF8A7F;
    --sunk: rgba(0,0,0,.3); --scrim: rgba(0,0,0,.5); --flow: #FFFFFF;
    --inv-bg: #FFFFFF; --inv-fg: #141416;
    --red: #EF3124;
    --lime: #A8F000;
    --violet: #EF3124; /* основной акцент тёмной темы — красный Альфы */
    --azure: #2E6EFF;
    --font-display: 'Manrope', 'Inter', system-ui, sans-serif;
    --font-body: 'Inter', -apple-system, 'Segoe UI', Roboto, sans-serif;
    --font-data: 'JetBrains Mono', ui-monospace, Menlo, monospace;
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --page: #EFEEEC; --paper: #F1F0EE; --surface: #FFFFFF; --surface2: #F7F6F4; --chip: #E3E1DE;
    --ink: #141416; --muted: #67666C; --line: rgba(20,20,30,.10);
    --fg: 22 22 28;

    --chip-bg: #FFFFFF; --chip-line: rgba(20,20,30,.10);
    --t-pos: #4A8700; --t-warn: #C27400; --t-stop: #E0281B; --t-neutral: #4A4A52; --t-off: #A3A3AA; --t-red-soft: #D22A1E;

    --inv-bg: #141416; --inv-fg: #FFFFFF;
  }
  .inv { background-color: var(--inv-bg) !important; color: var(--inv-fg) !important; }
  /* тёмная тема: выбранная компания — сплошная красная кнопка, как «С оптимизатором» */
  :root:not([data-theme="light"]) .chip-on { background: #EF3124 !important; border-color: #EF3124 !important; box-shadow: 0 0 26px -6px rgba(239,49,36,.9) !important; }
  :root:not([data-theme="light"]) .chip-on .chip-ic { background: rgba(255,255,255,.2) !important; box-shadow: none !important; }
  :root:not([data-theme="light"]) .chip-on .chip-sub { color: rgba(255,255,255,.85) !important; }
  html, body { background: var(--page); color: var(--ink); transition: background-color .3s ease; }
  body { background-image: radial-gradient(60% 40% at 0% 0%, rgba(239,49,36,.10), transparent 70%), radial-gradient(50% 40% at 100% 0%, rgba(114,48,255,.07), transparent 70%); background-attachment: fixed; }
  .card-dark { background: linear-gradient(180deg, rgba(255,255,255,.06), rgba(255,255,255,.02)), var(--surface); border: 1px solid rgba(255,255,255,.12); box-shadow: 0 1px 0 rgba(255,255,255,.05) inset, 0 20px 40px -24px rgba(0,0,0,.8); }
  :root[data-theme="light"] .card-dark { background: var(--surface); border-color: rgba(20,20,30,.08); box-shadow: 0 1px 2px rgba(20,20,30,.04), 0 18px 40px -26px rgba(20,20,30,.25); }
  :root[data-theme="light"] body { background-image: radial-gradient(60% 40% at 0% 0%, rgba(239,49,36,.07), transparent 70%); }
  body { font-family: var(--font-body); -webkit-font-smoothing: antialiased; }
  h1, h2, h3 { text-wrap: balance; }
  .wrap { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 12px 16px; }
  .tabular { font-variant-numeric: tabular-nums; }
  .no-scrollbar::-webkit-scrollbar { display: none; }
  .no-scrollbar { scrollbar-width: none; }
  .spring { transition-timing-function: cubic-bezier(.2,.9,.25,1.12); }
  .eyebrow { font-size: 10.5px; letter-spacing: .12em; text-transform: uppercase; font-weight: 700; color: var(--muted); }
  input[type=range] { accent-color: var(--red); width: 100%; }
  select, input[type=number], input[type=text] { font: inherit; }
  :focus-visible { outline: 2px solid var(--azure); outline-offset: 2px; border-radius: 8px; }
  @keyframes fadeUp { from { opacity: .001; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  @keyframes pulseRing { 0% { box-shadow: 0 0 0 0 rgba(239,49,36,.55); } 100% { box-shadow: 0 0 0 16px rgba(239,49,36,0); } }
  @keyframes shimmer { from { transform: translateX(-150%) skewX(-20deg); } to { transform: translateX(350%) skewX(-20deg); } }
  @keyframes spin { to { transform: rotate(360deg); } }
  .fade-up { animation: fadeUp .4s ease both; }
  @keyframes fadeIn { from { opacity: .001; } to { opacity: 1; } }
  .fade-in { animation: fadeIn .28s ease both; }
  .shimmer::after { content: ''; position: absolute; top: 0; bottom: 0; width: 35%; background: linear-gradient(90deg, transparent, rgba(255,255,255,.35), transparent); animation: shimmer 3.2s ease-in-out infinite; }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
  @media (max-width: 380px) { .phone-wrap { zoom: .9; } }
  
  select { min-width: 0; max-width: 100%; text-overflow: ellipsis; }
  /* Демо: тёмная сцена «карта решения» */
  .stage { background: radial-gradient(48% 62% at 13% 52%, rgba(239,49,36,.22), transparent 70%), radial-gradient(36% 46% at 88% 6%, rgba(239,49,36,.08), transparent 70%), radial-gradient(40% 50% at 60% 100%, rgba(239,49,36,.06), transparent 70%), #0E0E11; color: #F4F4F5; }
  :root[data-theme="light"] .stage { background: radial-gradient(48% 62% at 13% 52%, rgba(239,49,36,.13), transparent 70%), radial-gradient(36% 46% at 88% 6%, rgba(239,49,36,.05), transparent 70%), #FAFAF8; color: #141416; border-color: rgba(20,20,30,.08) !important; box-shadow: 0 24px 60px -36px rgba(20,20,30,.3); }
  :root[data-theme="light"] .stage-grid { background-image: radial-gradient(rgba(20,20,30,.10) 1px, transparent 1px); }
  :root[data-theme="light"] .glass { background: rgba(255,255,255,.85); border-color: rgba(20,20,30,.10); box-shadow: 0 1px 2px rgba(20,20,30,.05); }
  :root[data-theme="light"] .stage .glass.panel { background: #FFFFFF; border-color: rgba(20,20,30,.09); box-shadow: 0 30px 60px -34px rgba(20,20,30,.35); }
  .stage-grid { background-image: radial-gradient(rgba(255,255,255,.10) 1px, transparent 1px); background-size: 22px 22px; -webkit-mask-image: radial-gradient(80% 80% at 50% 45%, #000 30%, transparent 85%); mask-image: radial-gradient(80% 80% at 50% 45%, #000 30%, transparent 85%); }
  .glass { background: linear-gradient(180deg, rgba(255,255,255,.10), rgba(255,255,255,.04)); border: 1px solid rgba(255,255,255,.16); }
  .stage .glass.panel { background: linear-gradient(180deg, rgba(40,40,46,.97), rgba(24,24,28,.97)); border-color: rgba(255,255,255,.16); }
  .flow { stroke-dasharray: 3 9; animation: dash 1.4s linear infinite; }
  @keyframes dash { to { stroke-dashoffset: -24; } }
  @keyframes orbit { to { transform: translate(-50%,-50%) rotate(360deg); } }
  .orbit { animation: orbit 90s linear infinite; }
  .thin-scroll { scrollbar-width: thin; scrollbar-color: rgba(255,255,255,.18) transparent; }
  .thin-scroll::-webkit-scrollbar { width: 5px; } .thin-scroll::-webkit-scrollbar-thumb { background: rgba(255,255,255,.18); border-radius: 4px; }
  .stage input[type=range] { accent-color: #EF3124; }
  .dark-scope { --surface: #141416; --paper: #222226; --ink: #F2F2F3; --muted: #9A9AA0; --line: rgba(255,255,255,.09); color: var(--ink); color-scheme: dark; }
  .dark-scope .bg-white { background-color: var(--paper) !important; }
